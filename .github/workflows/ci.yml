name: CI

on:
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  ARTIFACTS_PATH: downloaded_artifacts

  # Separate uv installations from each other on self-hosten runners
  # in case they share the working directory
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache-ci-${{ github.run_id }}-${{ github.run_attempt }}
  UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv-ci-${{ github.run_id }}-${{ github.run_attempt }}
  UV_TOOL_DIR: ${{ github.workspace }}/.uv-tools-ci-${{ github.run_id }}-${{ github.run_attempt }}
  UV_TOOL_BIN_DIR: ${{ github.workspace }}/.uv-bin-ci-${{ github.run_id }}-${{ github.run_attempt }}

  VAULT_COMMON_CI_SECRETS: &vault-common-ci-secrets |
    kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} UV_DEFAULT_INDEX | UV_DEFAULT_INDEX ;
    kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} INTERNAL_PYPI_USERNAME | UV_INDEX_INTERNAL_USERNAME ;
    kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} INTERNAL_PYPI_PASSWORD | UV_INDEX_INTERNAL_PASSWORD ;
    kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} VENDORED_ARTIFACTS_URLS | VENDORED_ARTIFACTS_URLS

jobs:
  lint:
    name: Lint
    runs-on: ["${{ vars.UBUNTU_RUNNER }}", "X64"]
    steps:
      - name: Import secrets from Vault
        # Vault secrets must not be exposed to pull requests from forks.
        if: >-
          ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository }}
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ secrets.VAULT_URL }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          namespace: iac-expkits/prod
          secrets: *vault-common-ci-secrets
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Python development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev
      - run: uv sync --group dev --no-install-project
      - run: uv run pre-commit run --all-files

  build:
    name: Build
    runs-on: ["${{ vars.UBUNTU_RUNNER }}", "X64"]
    steps:
      - name: Import secrets from Vault
        # Vault secrets must not be exposed to pull requests from forks.
        if: >-
          ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository }}
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ secrets.VAULT_URL }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          namespace: iac-expkits/prod
          secrets: *vault-common-ci-secrets
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Python development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev
      - run: uv build --wheel
      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error

  test_quick:
    name: Quick Tests
    runs-on: ["${{ vars.UBUNTU_RUNNER }}", "X64"]
    steps:
      - name: Import secrets from Vault
        # Vault secrets must not be exposed to pull requests from forks.
        if: >-
          ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository }}
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ secrets.VAULT_URL }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          namespace: iac-expkits/prod
          secrets: *vault-common-ci-secrets
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Python development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev
      - run: uv sync --group test
      - run: |
          set -o pipefail
          uv run pytest --no-success-flaky-report -m "not slow" tests/ | tee coverage.txt
      - name: Publish coverage summary
        run: |
          {
            echo "## Coverage"
            echo ""
            echo '```text'
            tail -n 20 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  test_e2e:
    name: End-to-End Smoke Tests (${{ matrix.suite }}, shard index ${{ matrix.index }})
    # End-to-end tests require secrets and therefore cannot run for fork PRs.
    if: >-
      ${{ (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      github.repository_owner != 'arm' }}
    runs-on: ["${{ vars.UBUNTU_RUNNER }}", "X64"]
    needs:
      - build
    strategy:
      fail-fast: true
      matrix:
        include:
          - suite: tflite
            index: 0
            shard_count: 3
            artifacts: ${{ vars.MLIA_E2E_TFLITE_ARTIFACTS }}
            backends: ${{ vars.MLIA_E2E_TFLITE_BACKENDS }}
            executions: ${{ vars.MLIA_E2E_TFLITE_EXECUTIONS }}
            converter_package: mlia-converters-litert
            archive_path: ""
            extract_destination: ""
          - suite: tosa
            index: 0
            shard_count: 1
            artifacts: ${{ vars.MLIA_E2E_TOSA_ARTIFACTS }}
            backends: ${{ vars.MLIA_E2E_TOSA_BACKENDS }}
            executions: ${{ vars.MLIA_E2E_TOSA_EXECUTIONS }}
            converter_package: ""
            archive_path: ""
            extract_destination: ""
          - suite: pytorch
            index: 0
            shard_count: 1
            artifacts: ${{ vars.MLIA_E2E_PYTORCH_ARTIFACTS }}
            backends: ${{ vars.MLIA_E2E_PYTORCH_BACKENDS }}
            executions: ${{ vars.MLIA_E2E_PYTORCH_EXECUTIONS }}
            converter_package: ""
            dependency_group: pytorch-e2e
            archive_path: ""
            extract_destination: ""
          - suite: profiling
            index: 0
            shard_count: 1
            artifacts: ${{ vars.MLIA_E2E_PROFILING_ARTIFACTS }}
            backends: ${{ vars.MLIA_E2E_PROFILING_BACKENDS }}
            executions: ${{ vars.MLIA_E2E_PROFILING_EXECUTIONS }}
            converter_package: ""
            archive_path: e2e_config/profiling_archives/fpga-results-multi-chain-capture.zip
            extract_destination: e2e_config/profiling
    steps:
      - name: Import secrets from Vault
        # Vault secrets must not be exposed to pull requests from forks.
        if: >-
          ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository }}
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ secrets.VAULT_URL }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          namespace: iac-expkits/prod
          secrets: |
            ${{ env.VAULT_COMMON_CI_SECRETS }} ;
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} ARTIFACT_GIT_SOURCE_PASSWORD | ARTIFACT_GIT_SOURCE_PASSWORD ;
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} ARTIFACT_HTTP_SOURCE_TOKEN | ARTIFACT_HTTP_SOURCE_TOKEN
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install git-lfs
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
      - name: Prepare artifacts
        if: ${{ matrix.artifacts != '' }}
        uses: Arm-Debug/github-workflow-wizardry/.github/actions/prepare-artifacts@main
        env:
          ARTIFACT_GIT_SOURCE_HOST: ${{ vars.ARTIFACT_GIT_SOURCE_HOST }}
          ARTIFACT_GIT_SOURCE_USERNAME: ${{ vars.ARTIFACT_GIT_SOURCE_USERNAME }}
          ARTIFACT_GIT_SOURCE_PASSWORD: ${{ env.ARTIFACT_GIT_SOURCE_PASSWORD }}
          ARTIFACT_HTTP_SOURCE_HOST: ${{ vars.ARTIFACT_HTTP_SOURCE_HOST }}
          ARTIFACT_HTTP_SOURCE_AUTH: ${{ vars.ARTIFACT_HTTP_SOURCE_AUTH }}
          ARTIFACT_HTTP_SOURCE_TOKEN: ${{ env.ARTIFACT_HTTP_SOURCE_TOKEN }}
        with:
          artifacts: ${{ matrix.artifacts }}
          destination: ${{ env.ARTIFACTS_PATH }}
      - name: Extract ZIP artifact
        if: ${{ matrix.artifacts != '' && matrix.archive_path != '' }}
        env:
          ARCHIVE_PATH: ${{ env.ARTIFACTS_PATH }}/${{ matrix.archive_path }}
          EXTRACT_DESTINATION: ${{ env.ARTIFACTS_PATH }}/${{ matrix.extract_destination }}
        run: |
          rm -rf "$EXTRACT_DESTINATION"
          python3 -m zipfile -e "$ARCHIVE_PATH" "$EXTRACT_DESTINATION"
      - name: Sync test dependencies
        env:
          DEPENDENCY_GROUP: ${{ matrix.dependency_group }}
        run: |
          groups=(--only-group test)
          if [[ -n "$DEPENDENCY_GROUP" ]]; then
            groups+=(--only-group "$DEPENDENCY_GROUP")
          fi
          uv sync --no-install-project "${groups[@]}"
      # Ensure pip is available because mlia-backend install shells out to python -m pip for backend dependencies.
      - run: ${{ env.UV_PROJECT_ENVIRONMENT }}/bin/python -m ensurepip --upgrade
      - name: Run e2e pytest
        env:
          CONVERTER_PACKAGE: ${{ matrix.converter_package }}
          MLIA_E2E_ARTIFACTS: ${{ env.ARTIFACTS_PATH }}
          MLIA_E2E_BACKENDS: ${{ matrix.backends }}
          MLIA_E2E_EXECUTIONS: ${{ matrix.executions }}
          MLIA_E2E_SHARD_INDEX: ${{ matrix.index }}
          MLIA_E2E_SHARD_COUNT: ${{ matrix.shard_count }}
        run: |
          mkdir -p report
          rm -f "report/report-${{ matrix.index }}.xml"
          converter_args=()
          if [[ -n "$CONVERTER_PACKAGE" ]]; then
            converter_args=(--with "$CONVERTER_PACKAGE")
          fi
          set -o pipefail
          uv run --no-sync \
            --with dist/*.whl \
            "${converter_args[@]}" \
            --with pip \
            -- pytest -v tests/test_e2e.py \
              -x \
              -s \
              --capture=tee-sys \
              -o junit_logging=out-err \
              -o junit_log_passing_tests=true \
              --no-cov \
              --junitxml="report/report-${{ matrix.index }}.xml"
      - name: Upload e2e junit
        if: ${{ always() && hashFiles(format('report/report-{0}.xml', matrix.index)) != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-junit-shard-${{ matrix.suite }}-${{ matrix.index }}
          path: report/*.xml
