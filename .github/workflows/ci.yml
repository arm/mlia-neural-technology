name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      TEST_CONFIG_REF:
        description: Branch, tag, or commit of Arm-Debug/mlia-test-config (leave blank for the main branch)
        type: string
        required: false

env:
  PYTHON_VERSION: "3.12"
  DEFAULT_TEST_CONFIG_REF: "main"

  # Separate uv installations from each other on self-hosten runners
  # in case they share the working directory
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache-ci-${{ github.run_id }}-${{ github.run_attempt }}
  UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv-ci-${{ github.run_id }}-${{ github.run_attempt }}
  UV_TOOL_DIR: ${{ github.workspace }}/.uv-tools-ci-${{ github.run_id }}-${{ github.run_attempt }}
  UV_TOOL_BIN_DIR: ${{ github.workspace }}/.uv-bin-ci-${{ github.run_id }}-${{ github.run_attempt }}

  VAULT_COMMON_CI_SECRETS: &vault-common-ci-secrets |
    kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} UV_DEFAULT_INDEX | UV_DEFAULT_INDEX ;
    kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} INTERNAL_PYPI_USERNAME | UV_INDEX_INTERNAL_USERNAME ;
    kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} INTERNAL_PYPI_PASSWORD | UV_INDEX_INTERNAL_PASSWORD ;
    kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} VENDORED_ARTIFACTS_URLS | VENDORED_ARTIFACTS_URLS

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
    secrets: inherit

  build:
    name: Build
    runs-on: ["${{ vars.UBUNTU_RUNNER }}", "X64"]
    steps:
      - name: Import secrets from Vault
        # Vault secrets must not be exposed to pull requests from forks.
        if: >-
          ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository }}
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ secrets.VAULT_URL }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          namespace: iac-expkits/prod
          secrets: *vault-common-ci-secrets
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Python development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev
      - run: uv build --wheel
      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error

  test_quick:
    name: Quick Tests
    runs-on: ["${{ vars.UBUNTU_RUNNER }}", "X64"]
    steps:
      - name: Import secrets from Vault
        # Vault secrets must not be exposed to pull requests from forks.
        if: >-
          ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository }}
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ secrets.VAULT_URL }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          namespace: iac-expkits/prod
          secrets: *vault-common-ci-secrets
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Python development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev
      - run: uv sync --group test
      - run: |
          set -o pipefail
          uv run pytest --no-success-flaky-report -m "not slow" tests/ | tee coverage.txt
      - name: Publish coverage summary
        run: |
          {
            echo "## Coverage"
            echo ""
            echo '```text'
            tail -n 20 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  prepare_e2e:
    name: Load End-to-End Test Cases
    # The private configuration repository requires secrets unavailable to fork PRs.
    if: >-
      ${{ (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      github.repository_owner != 'arm' }}
    runs-on: ["${{ vars.UBUNTU_RUNNER }}", "X64"]
    outputs:
      test_cases: ${{ steps.cases.outputs.MLIA_E2E_TEST_CASES }}
      profiling_test_cases: ${{ steps.cases.outputs.MLIA_E2E_PROFILING_TEST_CASES }}
    steps:
      - name: Checkout e2e configuration
        uses: actions/checkout@v4
        with:
          repository: Arm-Debug/mlia-test-config
          ref: ${{ inputs.TEST_CONFIG_REF || env.DEFAULT_TEST_CONFIG_REF }}
          token: ${{ secrets.GH_ADMIN_TOKEN }}
          path: mlia-test-config
          persist-credentials: false
      - name: Install JSON parser
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
      - name: Read test cases
        id: cases
        shell: bash
        working-directory: mlia-test-config/mlia-neural-technology
        run: |
          set -euo pipefail

          # Read MLIA_E2E_TEST_CASES.json and MLIA_E2E_PROFILING_TEST_CASES.json
          for variable in MLIA_E2E_TEST_CASES MLIA_E2E_PROFILING_TEST_CASES; do
            cases=$(jq -ce '
              if type == "array" and length > 0 and all(.[]; type == "object")
              then . else error("Expected a non-empty array of test cases") end
            ' "$variable.json")
            printf '%s=%s\n' "$variable" "$cases" >> "$GITHUB_OUTPUT"
          done

  test_e2e:
    name: End-to-End Tests (${{ matrix.name }})
    needs: [build, prepare_e2e]
    # Checkout and artifact downloads require secrets unavailable to fork PRs.
    if: >-
      ${{ (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      github.repository_owner != 'arm' }}
    runs-on: ["${{ vars.UBUNTU_RUNNER }}", "X64"]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare_e2e.outputs.test_cases) }}
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download plugin wheel
        uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - name: Import secrets from Vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ secrets.VAULT_URL }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          namespace: iac-expkits/prod
          secrets: |
            ${{ env.VAULT_COMMON_CI_SECRETS }} ;
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} ARTIFACT_GIT_SOURCE_PASSWORD | ARTIFACT_GIT_SOURCE_PASSWORD ;
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} ARTIFACT_HTTP_SOURCE_TOKEN | ARTIFACT_HTTP_SOURCE_TOKEN
      - name: Install e2e system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs jq python3-dev
      - name: Run MLIA e2e tests
        id: e2e
        uses: Arm-Debug/mlia-test-runner/.github/actions/mlia-e2e@5dc9c9d000d90aa024ee563213c3b3c9f9e588f7
        with:
          wheelPath: dist/*.whl
          testCase: ${{ toJSON(matrix) }}
          pythonVersion: ${{ env.PYTHON_VERSION }}
          gitSourceHost: ${{ vars.ARTIFACT_GIT_SOURCE_HOST }}
          gitSourceUsername: ${{ vars.ARTIFACT_GIT_SOURCE_USERNAME }}
          gitSourcePassword: ${{ env.ARTIFACT_GIT_SOURCE_PASSWORD }}
          httpSourceHost: ${{ vars.ARTIFACT_HTTP_SOURCE_HOST }}
          httpSourceAuth: ${{ vars.ARTIFACT_HTTP_SOURCE_AUTH }}
          httpSourceToken: ${{ env.ARTIFACT_HTTP_SOURCE_TOKEN }}
          packageIndexUrl: ${{ env.UV_DEFAULT_INDEX }}
          packageIndexUsername: ${{ env.UV_INDEX_INTERNAL_USERNAME }}
          packageIndexPassword: ${{ env.UV_INDEX_INTERNAL_PASSWORD }}
      - name: Upload e2e output
        if: ${{ always() && steps.e2e.outputs.logsPath != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output-${{ matrix.name }}
          path: ${{ steps.e2e.outputs.logsPath }}
          if-no-files-found: warn

  test_e2e_profiling:
    name: Profiling End-to-End Tests (${{ matrix.name }})
    needs: [build, prepare_e2e]
    # Profiling artifact downloads require secrets unavailable to fork PRs.
    if: >-
      ${{ (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      github.repository_owner != 'arm' }}
    runs-on: ["${{ vars.UBUNTU_RUNNER }}", "X64"]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare_e2e.outputs.profiling_test_cases) }}
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download plugin wheel
        uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - name: Import secrets from Vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ secrets.VAULT_URL }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          namespace: iac-expkits/prod
          secrets: |
            ${{ env.VAULT_COMMON_CI_SECRETS }} ;
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} ARTIFACT_GIT_SOURCE_PASSWORD | ARTIFACT_GIT_SOURCE_PASSWORD ;
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} ARTIFACT_HTTP_SOURCE_TOKEN | ARTIFACT_HTTP_SOURCE_TOKEN
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install profiling test dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs jq python3-dev
      - name: Prepare profiling workspace
        id: profiling
        shell: bash
        run: |
          work=$(mktemp -d "$RUNNER_TEMP/mlia-profiling.XXXXXX")
          echo "workDirectory=$work" >> "$GITHUB_OUTPUT"
      - name: Download profiling artifacts
        uses: Arm-Debug/github-workflow-wizardry/.github/actions/prepare-artifacts@d700621dafc25dea2b4c5d8531171af5ec8e00ee
        env:
          ARTIFACT_GIT_SOURCE_HOST: ${{ vars.ARTIFACT_GIT_SOURCE_HOST }}
          ARTIFACT_GIT_SOURCE_USERNAME: ${{ vars.ARTIFACT_GIT_SOURCE_USERNAME }}
          ARTIFACT_GIT_SOURCE_PASSWORD: ${{ env.ARTIFACT_GIT_SOURCE_PASSWORD }}
          ARTIFACT_HTTP_SOURCE_HOST: ${{ vars.ARTIFACT_HTTP_SOURCE_HOST }}
          ARTIFACT_HTTP_SOURCE_AUTH: ${{ vars.ARTIFACT_HTTP_SOURCE_AUTH }}
          ARTIFACT_HTTP_SOURCE_TOKEN: ${{ env.ARTIFACT_HTTP_SOURCE_TOKEN }}
        with:
          artifacts: ${{ toJSON(matrix.artifacts) }}
          destination: ${{ steps.profiling.outputs.workDirectory }}/downloaded_artifacts
      - name: Run profiling performance check
        shell: bash
        env:
          TEST_CASE: ${{ toJSON(matrix) }}
          WORK_DIRECTORY: ${{ steps.profiling.outputs.workDirectory }}
        run: |
          set -euo pipefail
          wheels=("$GITHUB_WORKSPACE"/dist/*.whl)
          if [[ ${#wheels[@]} -ne 1 || ! -f "${wheels[0]}" ]]; then
            echo "Expected exactly one plugin wheel" >&2
            exit 1
          fi
          # Test the built wheel without syncing the source project or dev dependencies.
          uv venv --python "$PYTHON_VERSION" "$WORK_DIRECTORY/.venv"
          uv pip install --python "$WORK_DIRECTORY/.venv/bin/python" "${wheels[0]}"
          export VIRTUAL_ENV="$WORK_DIRECTORY/.venv"
          unset UV_PROJECT_ENVIRONMENT
          cd "$WORK_DIRECTORY"

          archive=$(jq -er '.archive_path' <<< "$TEST_CASE")
          uv run --no-project python -m zipfile -e \
            "$WORK_DIRECTORY/downloaded_artifacts/$archive" "$WORK_DIRECTORY/data"
          profiling_data=$(jq -er '.profiling_data' <<< "$TEST_CASE")
          test -d "$WORK_DIRECTORY/data/$profiling_data"
          target=$(jq -er '.target' <<< "$TEST_CASE")
          model_args=()
          model=$(jq -r '.model // empty' <<< "$TEST_CASE")
          if [[ -n "$model" ]]; then
            test -f "$WORK_DIRECTORY/data/$model"
            model_args=(-- "$WORK_DIRECTORY/data/$model")
          fi
          uv run --no-project mlia check -t "$target" -b neural-technology-profiling-data \
            --performance --profiling-data "$WORK_DIRECTORY/data/$profiling_data" \
            "${model_args[@]}" 2>&1 | tee "$WORK_DIRECTORY/run.log"
      - name: Upload profiling output
        if: ${{ always() && steps.profiling.outputs.workDirectory != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-profiling-${{ matrix.name }}
          path: ${{ steps.profiling.outputs.workDirectory }}/run.log
          if-no-files-found: warn
