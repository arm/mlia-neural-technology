name: Docs

on:
  pull_request:
    paths:
      - 'README.md'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'docs/**'
      - '.github/workflows/docs.yml'

env:
  PYTHON_VERSION: '3.10'
  VAULT_COMMON_CI_SECRETS: &vault-common-ci-secrets |
    kv/data/MLIA/CI INTERNAL_PYPI_HOST | INTERNAL_PYPI_HOST ;
    kv/data/MLIA/CI INTERNAL_PYPI_USERNAME | UV_INDEX_INTERNAL_USERNAME ;
    kv/data/MLIA/CI INTERNAL_PYPI_PASSWORD | UV_INDEX_INTERNAL_PASSWORD ;
    kv/data/MLIA/CI VENDORED_ARTIFACTS_URLS | VENDORED_ARTIFACTS_URLS

jobs:
  build-docs:
    name: Build docs
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-24.04-arm' }}
    steps:
      - name: Import secrets from Vault
        # Vault secrets must not be exposed to pull requests from forks.
        if: >-
          ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository }}
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ secrets.VAULT_URL }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          namespace: iac-expkits/prod
          secrets: *vault-common-ci-secrets
      - name: Configure uv package index
        run: |
          if [ -n "${INTERNAL_PYPI_HOST:-}" ]; then
            echo "UV_DEFAULT_INDEX=internal=${INTERNAL_PYPI_HOST}" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --no-sources --no-install-project --only-group docs
      - run: uv run mkdocs build --strict
      - name: Upload docs artifact
        uses: actions/upload-artifact@v6
        with:
          name: docs-site-mlia-neural-technology
          path: .mkdocs/site/
          if-no-files-found: error
