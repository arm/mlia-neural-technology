name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.10"
  ARTIFACTS_PATH: downloaded_artifacts

  # Separate uv installations from each other on self-hosten runners
  # in case they share the working directory
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache-ci-${{ github.run_id }}-${{ github.run_attempt }}
  UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv-ci-${{ github.run_id }}-${{ github.run_attempt }}
  UV_TOOL_DIR: ${{ github.workspace }}/.uv-tools-ci-${{ github.run_id }}-${{ github.run_attempt }}
  UV_TOOL_BIN_DIR: ${{ github.workspace }}/.uv-bin-ci-${{ github.run_id }}-${{ github.run_attempt }}

  VAULT_COMMON_CI_SECRETS: &vault-common-ci-secrets |
    kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} UV_DEFAULT_INDEX | UV_DEFAULT_INDEX ;
    kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} INTERNAL_PYPI_USERNAME | UV_INDEX_INTERNAL_USERNAME ;
    kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} INTERNAL_PYPI_PASSWORD | UV_INDEX_INTERNAL_PASSWORD ;
    kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} VENDORED_ARTIFACTS_URLS | VENDORED_ARTIFACTS_URLS

jobs:
  build_and_test_wheel:
    name: Build And Test Wheel
    runs-on: ["${{ vars.UBUNTU_RUNNER }}", "X64"]
    steps:
      - name: Import secrets from Vault
        # Vault secrets must not be exposed to pull requests from forks.
        if: >-
          ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository }}
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ secrets.VAULT_URL }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          namespace: iac-expkits/prod
          secrets: *vault-common-ci-secrets
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv build --wheel
      - run: uv sync --no-sources --no-install-project --group test
      - run: |
          set -o pipefail
          uv run --no-sync \
            --with dist/*.whl \
            -- pytest --no-success-flaky-report tests/ | tee coverage.txt
      - name: Publish coverage summary
        run: |
          {
            echo "## Coverage"
            echo ""
            echo '```text'
            tail -n 20 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: built-wheel
          path: dist/*.whl
          if-no-files-found: error

  test_e2e:
    name: End-to-End Tests (${{ matrix.suite }} Shard ${{ matrix.display_index }}/${{ matrix.total }})
    if: ${{ github.repository_owner != 'arm' }}
    runs-on: ["${{ vars.UBUNTU_RUNNER }}", "X64"]
    needs:
      - build_and_test_wheel
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: tflite, index: 0, display_index: 1, total: 3, converter_package: mlia-converters-litert}
          - {suite: tflite, index: 1, display_index: 2, total: 3, converter_package: mlia-converters-litert}
          - {suite: tflite, index: 2, display_index: 3, total: 3, converter_package: mlia-converters-litert}
          - {suite: pytorch, index: 0, display_index: 1, total: 1, converter_package: mlia-converters-pytorch}
    steps:
      - name: Import secrets from Vault
        # Vault secrets must not be exposed to pull requests from forks.
        if: >-
          ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository }}
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ secrets.VAULT_URL }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          namespace: iac-expkits/prod
          secrets: |
            ${{ env.VAULT_COMMON_CI_SECRETS }} ;
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} ARTIFACT_GIT_SOURCE_PASSWORD | ARTIFACT_GIT_SOURCE_PASSWORD ;
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} ARTIFACT_HTTP_SOURCE_TOKEN | ARTIFACT_HTTP_SOURCE_TOKEN
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: built-wheel
          path: dist
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install git-lfs
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
      - name: Prepare artifacts
        if: ${{ (matrix.suite == 'pytorch' && vars.MLIA_E2E_PYTORCH_ARTIFACTS || vars.MLIA_E2E_TFLITE_ARTIFACTS) != '' }}
        uses: Arm-Debug/github-workflow-wizardry/.github/actions/prepare-artifacts@main
        env:
          ARTIFACT_GIT_SOURCE_HOST: ${{ vars.ARTIFACT_GIT_SOURCE_HOST }}
          ARTIFACT_GIT_SOURCE_USERNAME: ${{ vars.ARTIFACT_GIT_SOURCE_USERNAME }}
          ARTIFACT_GIT_SOURCE_PASSWORD: ${{ env.ARTIFACT_GIT_SOURCE_PASSWORD }}
          ARTIFACT_HTTP_SOURCE_HOST: ${{ vars.ARTIFACT_HTTP_SOURCE_HOST }}
          ARTIFACT_HTTP_SOURCE_AUTH: ${{ vars.ARTIFACT_HTTP_SOURCE_AUTH }}
          ARTIFACT_HTTP_SOURCE_TOKEN: ${{ env.ARTIFACT_HTTP_SOURCE_TOKEN }}
        with:
          artifacts: ${{ matrix.suite == 'pytorch' && vars.MLIA_E2E_PYTORCH_ARTIFACTS || vars.MLIA_E2E_TFLITE_ARTIFACTS }}
          destination: ${{ env.ARTIFACTS_PATH }}
      - name: Prepare API e2e artifacts
        if: ${{ matrix.index == 0 && vars.MLIA_API_E2E_ARTIFACTS != '' }}
        uses: Arm-Debug/github-workflow-wizardry/.github/actions/prepare-artifacts@main
        env:
          ARTIFACT_GIT_SOURCE_HOST: ${{ vars.ARTIFACT_GIT_SOURCE_HOST }}
          ARTIFACT_GIT_SOURCE_USERNAME: ${{ vars.ARTIFACT_GIT_SOURCE_USERNAME }}
          ARTIFACT_GIT_SOURCE_PASSWORD: ${{ env.ARTIFACT_GIT_SOURCE_PASSWORD }}
          ARTIFACT_HTTP_SOURCE_HOST: ${{ vars.ARTIFACT_HTTP_SOURCE_HOST }}
          ARTIFACT_HTTP_SOURCE_AUTH: ${{ vars.ARTIFACT_HTTP_SOURCE_AUTH }}
          ARTIFACT_HTTP_SOURCE_TOKEN: ${{ env.ARTIFACT_HTTP_SOURCE_TOKEN }}
        with:
          artifacts: ${{ vars.MLIA_API_E2E_ARTIFACTS }}
          destination: ${{ env.ARTIFACTS_PATH }}
      - run: uv sync --no-sources --no-install-project --only-group test
      # Ensure pip is available because mlia-backend install shells out to python -m pip for backend dependencies.
      - run: ${{ env.UV_PROJECT_ENVIRONMENT }}/bin/python -m ensurepip --upgrade
      - name: Run e2e pytest
        env:
          MLIA_E2E_ARTIFACTS: ${{ env.ARTIFACTS_PATH }}
          MLIA_E2E_BACKENDS: ${{ matrix.suite == 'pytorch' && vars.MLIA_E2E_PYTORCH_BACKENDS || vars.MLIA_E2E_TFLITE_BACKENDS }}
          MLIA_E2E_EXECUTIONS: ${{ matrix.suite == 'pytorch' && vars.MLIA_E2E_PYTORCH_EXECUTIONS || vars.MLIA_E2E_TFLITE_EXECUTIONS }}
          MLIA_E2E_SHARD_INDEX: ${{ matrix.index }}
          MLIA_E2E_SHARD_COUNT: ${{ matrix.total }}
        run: |
          mkdir -p report
          rm -f "report/report-${{ matrix.index }}.xml"
          rm -f "report/api-report-${{ matrix.index }}.xml"
          rm -rf "report/pdf-${{ matrix.index }}"
          set -o pipefail
          uv run --no-sync \
            --with dist/*.whl \
            --with ${{ matrix.converter_package }} \
            --with pip \
            -- pytest -v tests/test_e2e.py \
              -x \
              -s \
              --capture=tee-sys \
              -o junit_logging=out-err \
              -o junit_log_passing_tests=true \
              --no-cov \
              --junitxml="report/report-${{ matrix.index }}.xml"
      - name: Run API e2e pytest
        if: ${{ matrix.index == 0 }}
        env:
          MLIA_E2E_ARTIFACTS: ${{ env.ARTIFACTS_PATH }}
          MLIA_E2E_BACKENDS: ${{ matrix.suite == 'pytorch' && vars.MLIA_E2E_PYTORCH_BACKENDS || vars.MLIA_E2E_TFLITE_BACKENDS }}
          MLIA_API_E2E_SUITE: ${{ matrix.suite }}
          MLIA_API_E2E_TOSA_MODEL: ${{ vars.MLIA_API_E2E_TOSA_MODEL }}
          MLIA_API_E2E_VGF_MODEL: ${{ vars.MLIA_API_E2E_VGF_MODEL }}
          MLIA_API_E2E_TFLITE_MODEL: ${{ vars.MLIA_API_E2E_TFLITE_MODEL }}
          MLIA_API_E2E_PYTORCH_MODEL: ${{ vars.MLIA_API_E2E_PYTORCH_MODEL }}
        run: |
          set -o pipefail
          uv run --no-sync \
            --with dist/*.whl \
            --with ${{ matrix.converter_package }} \
            --with pip \
            -- pytest -v tests/test_e2e_api.py \
              -x \
              -s \
              --capture=tee-sys \
              -o junit_logging=out-err \
              -o junit_log_passing_tests=true \
              --no-cov \
              --junitxml="report/api-report-${{ matrix.index }}.xml"
      - name: Upload e2e junit
        if: >-
          ${{
            always() &&
            (
              hashFiles(format('report/report-{0}.xml', matrix.index)) != '' ||
              hashFiles(format('report/api-report-{0}.xml', matrix.index)) != ''
            )
          }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-junit-shard-${{ matrix.suite }}-${{ matrix.index }}
          path: report/*.xml

  combine_e2e_pdf:
    name: Combine E2E PDF Reports
    if: ${{ always() && github.repository_owner != 'arm' }}
    runs-on: ["${{ vars.UBUNTU_RUNNER }}", "X64"]
    needs:
      - test_e2e
    steps:
      - name: Import secrets from Vault
        # Vault secrets must not be exposed to pull requests from forks.
        if: >-
          ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository }}
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ secrets.VAULT_URL }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          namespace: iac-expkits/prod
          secrets: *vault-common-ci-secrets
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Download shard junit artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-junit-shard-*
          path: report/junit
          merge-multiple: true
      - name: Convert combined JUnit to PDF
        if: ${{ hashFiles('report/junit/*.xml') != '' }}
        uses: Arm-Debug/github-workflow-wizardry/.github/actions/junit-to-pdf@main
        with:
          report-path: report/junit
          output-dir: report/pdf-combined
      - name: Upload combined e2e pdf
        if: ${{ hashFiles('report/pdf-combined/*.pdf') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-pdf
          path: report/pdf-combined

  publish_release:
    name: Publish Release
    if: >-
      ${{
        always() &&
        needs.build_and_test_wheel.result == 'success' &&
        (github.repository_owner != 'arm' || github.ref_type == 'tag') &&
        (github.repository_owner == 'arm' || needs.test_e2e.result == 'success')
      }}
    runs-on: ["${{ vars.UBUNTU_RUNNER }}", "X64"]
    needs:
      - build_and_test_wheel
      - test_e2e
    steps:
      - name: Import secrets from Vault
        # Vault secrets must not be exposed to pull requests from forks.
        if: >-
          ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository }}
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ secrets.VAULT_URL }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          namespace: iac-expkits/prod
          secrets: |
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} PUBLISH_PYPI_HOST | UV_PUBLISH_URL ;
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} PUBLISH_PYPI_USERNAME | UV_PUBLISH_USERNAME ;
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} PUBLISH_PYPI_PASSWORD | UV_PUBLISH_PASSWORD
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: built-wheel
          path: dist
      - run: uv publish dist/*
