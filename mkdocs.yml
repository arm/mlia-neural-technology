site_name: MLIA for Arm Mali with Neural Technology
site_description: Documentation for the MLIA Neural Technology target and backend plugin.
site_url: https://arm.github.io/mlia-neural-technology/
repo_url: https://github.com/arm/mlia-neural-technology
repo_name: arm/mlia-neural-technology
edit_uri: edit/main/docs/source/
docs_dir: docs/source
site_dir: .mkdocs/site
strict: true

exclude_docs: |
  /landing-page/

hooks:
  - docs/scripts/landing.py

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.share

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Documentation: documentation.md
  - Target Profiles: target_profiles.md
  - Backends: backends.md
  - Outputs and Metrics: outputs_metrics.md
  - CLI: cli.md
  - ETRecord and ETDump: etrecord.md
  - Troubleshooting: troubleshooting.md
  - Development: development.md
