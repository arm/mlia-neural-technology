[project]
name = "mlia-neural-technology"
dynamic = ["version", "readme"]
description = "ML Inference Advisor NX Plugin"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ai-ml-sdk-model-converter==0.9.0",
    "tosa-tools==2026.2.1",
    "mlia==0.12.2"
]
keywords = ["ml", "arm", "nx", "neural-technology"]
authors = [{name = "Arm Ltd", email = "mlia@arm.com"}]
# This expression covers the open-source project code. Everything under the
# following directories is provided separately under LicenseRef-LICENSE:
# - src/mlia/_vendor/artifacts/nx-performance-estimator/
# - src/mlia/resources/nx-performance-estimator/
license = "Apache-2.0"
license-files = ["LICENSES/*.txt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.urls]
Homepage = "https://github.com/arm/mlia-neural-technology.git"

[project.entry-points."mlia.plugin.target"]
neural_technology = "mlia.target.neural_technology.plugin:NeuralTechnologyTargetPlugin"

[project.entry-points."mlia.plugin.backend"]
nx_performance_estimator = "mlia.backend.nx_performance_estimator.plugin:NXPerformanceEstimatorPlugin"
neural_technology_profiling_data = "mlia.backend.neural_technology_profiling_data.plugin:NeuralTechnologyProfilingDataPlugin"
ml_sdk_model_converter = "mlia.backend.ml_sdk_model_converter.plugin:MLSDKModelConverterPlugin"
tosa_flatbuffers = "mlia.backend.tosa_flatbuffers.plugin:TosaFlatBuffersPlugin"

[build-system]
requires = [
    "cmake>=3.28",
    "hatchling>=1.27.0",
    "pybind11>=2.13",
    "uv-dynamic-versioning>=0.8.2,<0.9.0"
]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
# Include implicit namespace packages under src/.
only-include = ["src/mlia"]
sources = ["src"]
exclude = [
    "src/mlia/_vendor/artifacts/ml-sdk-model-converter/**",
    "src/mlia/_vendor/artifacts/tosa-flatbuffers/**"
]

[tool.hatch.build.targets.sdist]
include = [
    "src/mlia/**",
    "CMakeLists.txt",
    "LICENSES/*.txt",
    "README.md",
    "hatch_build.py",
    "pyproject.toml"
]
exclude = [
    "src/mlia/_vendor/artifacts/ml-sdk-model-converter/**",
    "src/mlia/_vendor/artifacts/tosa-flatbuffers/**"
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
pattern = "default-unprefixed"
bump = true
fallback-version = "0.0.0.dev0"

[tool.uv]
# The editable wheel's build hook bundles vendor artifacts, so changes to its
# inputs must invalidate uv's cached package build rather than only exposing
# live Python source through the editable installation.
cache-keys = [
    {file = "pyproject.toml"},
    {file = "CMakeLists.txt"},
    {file = "hatch_build.py"},
    {file = "src/mlia/_vendor/artifacts/nx-performance-estimator/.sha256.linux"},
    {file = "src/mlia/_vendor/artifacts/nx-performance-estimator/.sha256.windows"},
    {git = {commit = true}}
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = {index = "pytorch-cpu"}

[tool.mypy]
# Suppress errors for optional dependencies and cross-repo imports.
ignore_missing_imports = true

[tool.blocklint]
max_issue_threshold = 1
blocklist = ["master", "slave", "blacklist", "whitelist", "dummy"]
wordlist = ["he", "she", "him", "her", "his", "hers"]
skip_files = ["LICENSES/CC-PDDC.txt", "docs/source/conf.py"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests that require heavyweight runtime dependencies or backend artifacts"
]
addopts = [
    "--cov=mlia.backend.ml_sdk_model_converter",
    "--cov=mlia.backend.nx_performance_estimator",
    "--cov=mlia.backend.neural_technology_profiling_data",
    "--cov=mlia.backend.tosa_flatbuffers",
    "--cov=mlia.nx_utils",
    "--cov=mlia.target.neural_technology",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=65"
]
pythonpath = ["src"]

[dependency-groups]
pytorch-e2e = [
    "mlia-converters-pytorch==0.1.1.dev11+db5f50e",
    "torch==2.12.0"
]
test = [
    "pytest~=9.0",
    "pytest-cov~=7.0",
    "flaky~=3.8.1",
    "jsonschema>=4.24,<5",
    "numpy==2.1.3",
    "mlia-converters-litert",
    "tensorflow",
    "tf-keras"
]
dev = [
    {include-group = "test"},
    "mypy==1.5.1",
    "pre-commit==4.5.1"
]
docs = [
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.5,<10.0",
    "pymdown-extensions>=10.0,<11.0"
]
