[project]
name = "mlia-neural-technology"
dynamic = ["version"]
description = "ML Inference Advisor NX Plugin"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mlia>=0.11.0.dev6"
]
keywords = ["ml", "arm", "nx", "neural-technology"]
authors = [{name = "Arm Ltd", email = "mlia@arm.com"}]
license = "Apache-2.0"
license-files = ["LICENSES/*.txt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.urls]
Homepage = "https://github.com/arm/mlia-neural-technology.git"

[project.entry-points."mlia.plugin.target"]
neural_technology = "mlia.target.neural_technology.plugin:NeuralTechnologyTargetPlugin"

[project.entry-points."mlia.plugin.backend"]
nx_performance_estimator = "mlia.backend.nx_performance_estimator.plugin:NXPerformanceEstimatorPlugin"
ml_sdk_model_converter = "mlia.backend.ml_sdk_model_converter.plugin:MLSDKModelConverterPlugin"
tosa_flatbuffers = "mlia.backend.tosa_flatbuffers.plugin:TosaFlatBuffersPlugin"

[build-system]
requires = [
    "hatchling>=1.27.0",
    "uv-dynamic-versioning>=0.8.2,<0.9.0"
]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build]
include = ["src/mlia/resources/**"]

[tool.hatch.build.targets.wheel]
# Include implicit namespace packages under src/.
only-include = ["src/mlia"]
sources = ["src"]

[tool.hatch.build.targets.sdist]
include = [
    "src/mlia/**",
    "src/mlia/_vendor/artifacts/**/.sha256",
    "src/mlia/_vendor/artifacts/**/.sha256.license",
    "LICENSES/*.txt",
    "README.md",
    "hatch_build.py",
    "pyproject.toml"
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
pattern = "default-unprefixed"
bump = true
fallback-version = "0.0.0.dev0"

[tool.mypy]
# Suppress errors for optional dependencies and cross-repo imports.
ignore_missing_imports = true

[tool.blocklint]
max_issue_threshold = 1
blocklist = ["master", "slave", "blacklist", "whitelist", "dummy"]
wordlist = ["he", "she", "him", "her", "his", "hers"]
skip_files = ["LICENSES/CC-PDDC.txt", "docs/source/conf.py"]

[tool.pytest.ini_options]
addopts = [
    "--cov=mlia.backend.ml_sdk_model_converter",
    "--cov=mlia.backend.nx_performance_estimator",
    "--cov=mlia.backend.tosa_flatbuffers",
    "--cov=mlia.nx_utils",
    "--cov=mlia.target.neural_technology",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=65"
]
pythonpath = ["src"]

[dependency-groups]
test = [
    "pytest~=9.0",
    "pytest-cov~=7.0",
    "flaky~=3.8.1",
    "numpy==2.2.6",
    "mlia-converters-tflite",
    "tensorflow",
    "tf-keras"
]
dev = [
    {include-group = "test"},
    "mypy==1.5.1",
    "pre-commit==4.5.1"
]
docs = [
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.5,<10.0",
    "pymdown-extensions>=10.0,<11.0"
]
